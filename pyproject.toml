[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opdps-rf-sc"
version = "0.1.0"
description = "Operator-guided residual diffusion for the MIT RFChallenge single-channel separation dataset"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pyyaml>=6.0",
  "tqdm>=4.66",
  "matplotlib>=3.7",
  "pandas>=2.0",
  "torch>=2.2",
  "diffusers>=0.35",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
